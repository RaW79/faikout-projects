<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="900" height="520" fill="white"/>

  <!-- Title -->
  <text x="450" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="15"
        text-decoration="underline" font-weight="bold">Two-Point Controller with Hysteresis</text>

  <!-- ═══ TOP CHART ═══ -->

  <!-- Hysterese band -->
  <rect x="250" y="88" width="628" height="115" fill="#fffacc"/>

  <!-- Hysteresis label box -->
  <rect x="710" y="60" width="108" height="24" fill="#fffacc" stroke="#aaa" stroke-width="1"/>
  <text x="764" y="77" text-anchor="middle" font-family="Arial, sans-serif" font-size="13">Hysteresis</text>

  <!-- Y-axis top -->
  <line x1="250" y1="45" x2="250" y2="260" stroke="black" stroke-width="2"/>
  <polygon points="250,40 244,52 256,52" fill="black"/>
  <text x="244" y="38" text-anchor="end" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Process value</text>

  <!-- X-axis top -->
  <line x1="250" y1="258" x2="878" y2="258" stroke="black" stroke-width="2"/>
  <polygon points="883,258 871,252 871,264" fill="black"/>
  <text x="880" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">T (Time)</text>

  <!-- Maximum (y=90) -->
  <line x1="250" y1="90" x2="878" y2="90" stroke="#cc3333" stroke-width="1.5" stroke-dasharray="7,4"/>
  <text x="242" y="94" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#cc3333">Maximum (Switch off)</text>

  <!-- Setpoint (y=145) -->
  <line x1="250" y1="145" x2="878" y2="145" stroke="#228b22" stroke-width="2"/>
  <text x="242" y="149" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#228b22">Setpoint</text>

  <!-- Minimum (y=200) -->
  <line x1="250" y1="200" x2="878" y2="200" stroke="#cc3333" stroke-width="1.5" stroke-dasharray="7,4"/>
  <text x="242" y="204" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#cc3333">Minimum (Switch on)</text>

  <!-- Wave -->
  <path d="
    M 260,200
    C 282,200 328,90  345,90
    C 362,90  408,200 425,200
    C 447,200 493,90  510,90
    C 527,90  573,200 590,200
    C 612,200 658,90  675,90
    C 692,90  738,200 755,200
    C 777,200 823,90  840,90
    C 851,90  868,135 872,148
  " fill="none" stroke="#e08a00" stroke-width="2.5"/>

  <!-- Vertical dashed lines – top chart -->
  <line x1="345" y1="90"  x2="345" y2="258" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="425" y1="200" x2="425" y2="258" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="510" y1="90"  x2="510" y2="258" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="590" y1="200" x2="590" y2="258" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="675" y1="90"  x2="675" y2="258" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="755" y1="200" x2="755" y2="258" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="840" y1="90"  x2="840" y2="258" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ═══ BOTTOM CHART ═══ -->

  <!-- Y-axis bottom -->
  <line x1="250" y1="285" x2="250" y2="495" stroke="black" stroke-width="2"/>
  <polygon points="250,280 244,292 256,292" fill="black"/>
  <text x="244" y="278" text-anchor="end" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Output</text>

  <!-- X-axis bottom -->
  <line x1="250" y1="493" x2="878" y2="493" stroke="black" stroke-width="2"/>
  <polygon points="883,493 871,487 871,499" fill="black"/>
  <text x="880" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">T (Time)</text>

  <!-- Y=0 label -->
  <text x="242" y="497" text-anchor="end" font-family="Arial, sans-serif" font-size="12">Y=0</text>

  <!-- Vertical dashed lines – bottom chart -->
  <line x1="345" y1="285" x2="345" y2="493" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="425" y1="285" x2="425" y2="493" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="510" y1="285" x2="510" y2="493" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="590" y1="285" x2="590" y2="493" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="675" y1="285" x2="675" y2="493" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="755" y1="285" x2="755" y2="493" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="840" y1="285" x2="840" y2="493" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Pulses: ON during rising phase (heater on) -->
  <rect x="260" y="393" width="85" height="100" fill="#4a90d9"/>
  <rect x="425" y="393" width="85" height="100" fill="#4a90d9"/>
  <rect x="590" y="393" width="85" height="100" fill="#4a90d9"/>
  <rect x="755" y="393" width="85" height="100" fill="#4a90d9"/>
</svg>
